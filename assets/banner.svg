<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#040711" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.5" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .grid-bg { opacity: 0.85; }
    .pulse-line {
      stroke-dasharray: 8 16;
      animation: dashMove 14s linear infinite;
    }
    .pulse-data {
      stroke-dasharray: 6 120;
      animation: dataPulse 4s ease-out infinite;
    }
    .floating-orb {
      animation: floatOrb 6s ease-in-out infinite alternate;
    }
    .floating-shield {
      animation: shieldBob 5s ease-in-out infinite alternate;
    }
    .badge-float {
      animation: badgeFloat 4s ease-in-out infinite alternate;
    }

    @keyframes dashMove {
      from { stroke-dashoffset: 240; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes dataPulse {
      0% { stroke-dashoffset: 260; opacity: 0.1; }
      50% { opacity: 1; }
      100% { stroke-dashoffset: 0; opacity: 0.1; }
    }
    @keyframes floatOrb {
      0% { transform: translateY(0px) scale(1); }
      100% { transform: translateY(-12px) scale(1.05); }
    }
    @keyframes shieldBob {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }
    @keyframes badgeFloat {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-6px); }
    }

    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 38px;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 16px;
      fill: #94a3b8;
    }
    .tag-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 0.5px;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />
  <rect width="1200" height="360" fill="url(#cyberGrid)" class="grid-bg" />

  <!-- Dynamic Animated Ambient Glows (Kept strictly in background behind text) -->
  <g opacity="0.45">
    <circle cx="200" cy="80" r="160" fill="#0284c7" filter="url(#neonGlow)" opacity="0.25" class="floating-orb" />
    <circle cx="1000" cy="280" r="180" fill="#6366f1" filter="url(#neonGlow)" opacity="0.2" class="floating-orb" style="animation-duration: 8s;" />
    <circle cx="850" cy="90" r="120" fill="#a855f7" filter="url(#neonGlow)" opacity="0.15" class="floating-orb" style="animation-duration: 7s;" />
  </g>

  <!-- Dynamic Cyber Network Topology (Background / Right Side) -->
  <g opacity="0.6">
    <path d="M 720 180 L 840 100 L 980 130 L 1080 80 L 1140 180 L 1040 260 L 880 250 Z" 
          fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" class="pulse-line" />
    <path d="M 720 180 L 980 130 M 840 100 L 880 250 M 980 130 L 1040 260" 
          fill="none" stroke="#818cf8" stroke-width="1" stroke-opacity="0.2" />

    <!-- Pulsing Data Packets flowing on lines -->
    <path d="M 720 180 L 840 100 L 980 130 L 1080 80 L 1140 180" 
          fill="none" stroke="#38bdf8" stroke-width="3" filter="url(#nodeGlow)" class="pulse-data" />
    <path d="M 1140 180 L 1040 260 L 880 250 L 720 180" 
          fill="none" stroke="#c084fc" stroke-width="3" filter="url(#nodeGlow)" class="pulse-data" style="animation-delay: 2s;" />

    <!-- Network Nodes -->
    <circle cx="840" cy="100" r="5" fill="#38bdf8" filter="url(#nodeGlow)" />
    <circle cx="980" cy="130" r="4" fill="#818cf8" filter="url(#nodeGlow)" />
    <circle cx="1080" cy="80" r="6" fill="#a855f7" filter="url(#nodeGlow)" />
    <circle cx="1140" cy="180" r="5" fill="#38bdf8" filter="url(#nodeGlow)" />
    <circle cx="1040" cy="260" r="6" fill="#6366f1" filter="url(#nodeGlow)" />
    <circle cx="880" cy="250" r="5" fill="#38bdf8" filter="url(#nodeGlow)" />
    <circle cx="720" cy="180" r="7" fill="#38bdf8" filter="url(#nodeGlow)" />
  </g>

  <!-- Central Floating Shield Icon Graphic (Right of text) -->
  <g transform="translate(930, 140)" class="floating-shield">
    <polygon points="0,-48 42,-28 42,24 0,54 -42,24 -42,-28" fill="url(#shieldGrad)" opacity="0.2" stroke="#38bdf8" stroke-width="2" />
    <!-- Lock / Keyhole Symbol -->
    <circle cx="0" cy="-6" r="14" fill="none" stroke="#ffffff" stroke-width="3.5" />
    <rect x="-16" y="-6" width="32" height="26" rx="4" fill="#ffffff" />
    <circle cx="0" cy="4" r="3.5" fill="#0b1329" />
    <path d="M -1.5 6 L 1.5 6 L 2 13 L -2 13 Z" fill="#0b1329" />
  </g>

  <!-- Foreground Content Block: Unobscured Text & Badges -->
  <g transform="translate(80, 0)">
    <!-- Top Category Tag -->
    <g transform="translate(0, 62)">
      <rect x="0" y="0" width="260" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.8" />
      <circle cx="14" cy="14" r="4" fill="#38bdf8">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="26" y="18" fill="#38bdf8" class="tag-text">ENTERPRISE CLOUD DATA DEFENSE</text>
    </g>

    <!-- Main Title (Graduated, crisp, high contrast) -->
    <text x="0" y="132" fill="url(#primaryGrad)" class="title-text">
      Mission-Critical Cloud Data Security
    </text>

    <!-- Subtitle -->
    <text x="0" y="172" class="subtitle-text">
      Curated Landscape of Secrets Management, PAM, DSPM, CSPM &amp; Key Infrastructure
    </text>

    <!-- Secondary descriptive line -->
    <text x="0" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#64748b">
      Protecting sensitive credentials, cryptographic vaults, and compliance postures across multi-cloud.
    </text>

    <!-- Interactive / Decorative Pillars Badges -->
    <g transform="translate(0, 240)" class="badge-float">
      <!-- Badge 1: Secrets & Vaults -->
      <g transform="translate(0, 0)">
        <rect width="145" height="38" rx="8" fill="url(#badgeGrad)" stroke="#334155" stroke-width="1.2" />
        <rect x="0" y="0" width="4" height="38" rx="2" fill="#38bdf8" />
        <text x="16" y="24" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="13">🔑 Secrets &amp; KMS</text>
      </g>

      <!-- Badge 2: PAM & Zero Trust -->
      <g transform="translate(160, 0)">
        <rect width="145" height="38" rx="8" fill="url(#badgeGrad)" stroke="#334155" stroke-width="1.2" />
        <rect x="0" y="0" width="4" height="38" rx="2" fill="#818cf8" />
        <text x="16" y="24" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="13">🛡️ Privileged PAM</text>
      </g>

      <!-- Badge 3: DSPM & Discovery -->
      <g transform="translate(320, 0)">
        <rect width="145" height="38" rx="8" fill="url(#badgeGrad)" stroke="#334155" stroke-width="1.2" />
        <rect x="0" y="0" width="4" height="38" rx="2" fill="#a855f7" />
        <text x="16" y="24" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="13">🔍 DSPM &amp; Posture</text>
      </g>

      <!-- Badge 4: GRC & Compliance -->
      <g transform="translate(480, 0)">
        <rect width="155" height="38" rx="8" fill="url(#badgeGrad)" stroke="#334155" stroke-width="1.2" />
        <rect x="0" y="0" width="4" height="38" rx="2" fill="#34d399" />
        <text x="16" y="24" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="13">⚖️ Audit &amp; GRC</text>
      </g>
    </g>

    <!-- Bottom Metrics Bar -->
    <g transform="translate(0, 310)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#475569">
        ✦ <tspan fill="#94a3b8">Updated for 2026</tspan> &nbsp;•&nbsp; ✦ <tspan fill="#94a3b8">SaaS Benchmarks with Starting Pricing</tspan> &nbsp;•&nbsp; ✦ <tspan fill="#94a3b8">Ranked Open-Source Repositories</tspan>
      </text>
    </g>
  </g>
</svg>
